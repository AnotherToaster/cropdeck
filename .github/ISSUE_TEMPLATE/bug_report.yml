name: Bug report
description: Something went wrong with a scan or a command
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach scans of real cards in full resolution - card art is copyrighted.
        A cropped corner, a `--debug` overlay or a description of the layout is usually enough.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and everything it printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: cropdeck version (`cropdeck --version`), operating system, scanner, dpi, cards per scan, backing (lid or paper).
    validations:
      required: true
