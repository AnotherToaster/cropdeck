name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit on main and the changelog
# line. It has to be a Conventional Commit: feat: ..., fix: ..., docs: ...

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    # release-please writes its own titles ("chore(main): release x.y.z")
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
