name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    # The basics for now: one Linux job. Windows, macOS and older Pythons come back into the
    # matrix once cropdeck has users on them.
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tesseract (Linux only; the OCR test is skipped elsewhere)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1
      - run: python -m pip install -U pip
      - run: python -m pip install ".[all,test]"
      - run: python -m unittest discover -s tests -v
